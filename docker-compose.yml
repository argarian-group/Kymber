services:
  secrets-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "if [ ! -s /run/kymber-secrets/service-encryption-key ]; then head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /tmp/service-encryption-key; chown 65532:65532 /tmp/service-encryption-key; chmod 0400 /tmp/service-encryption-key; mv /tmp/service-encryption-key /run/kymber-secrets/service-encryption-key; fi; chown 65532:65532 /run/kymber-secrets; chmod 0700 /run/kymber-secrets"]
    volumes:
      - kymber_secrets:/run/kymber-secrets

  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kymber
      - --entrypoints.web.address=:80
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-kymber}
      MARIADB_USER: ${DB_USER:-kymber}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SECURE_ONBOARD: ${SECURE_ONBOARD:-false}
      SERVICE_ENCRYPTION_KEY_FILE: /run/kymber-secrets/service-encryption-key
      KYMBER_SERVER_TOKEN_FILE: /run/kymber-secrets/server-token
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-kymber}
      DB_USER: ${DB_USER:-kymber}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    networks:
      - data
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.kymber-api.rule=Path(`/api`) || PathPrefix(`/api/`) || Path(`/health`)
      - traefik.http.routers.kymber-api.entrypoints=web
      - traefik.http.routers.kymber-api.priority=100
      - traefik.http.services.kymber-api.loadbalancer.server.port=8080
      - traefik.docker.network=kymber
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    volumes:
      - kymber_secrets:/run/kymber-secrets

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.kymber-frontend.rule=PathPrefix(`/`) && !Path(`/api`) && !PathPrefix(`/api/`) && !Path(`/health`)
      - traefik.http.routers.kymber-frontend.entrypoints=web
      - traefik.http.routers.kymber-frontend.priority=1
      - traefik.http.routers.kymber-frontend.middlewares=kymber-spa
      - traefik.http.services.kymber-frontend.loadbalancer.server.port=80
      - traefik.docker.network=kymber
      - traefik.http.middlewares.kymber-spa.errors.status=404
      - traefik.http.middlewares.kymber-spa.errors.statusRewrites.404=200
      - traefik.http.middlewares.kymber-spa.errors.service=kymber-frontend
      - traefik.http.middlewares.kymber-spa.errors.query=/index.html
    depends_on:
      - backend
      - traefik
    networks:
      - proxy

  server:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: server
    restart: unless-stopped
    environment:
      KYMBER_API_URL: http://backend:8080
      KYMBER_SERVER_TOKEN_FILE: /run/kymber-secrets/server-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kymber_secrets:/run/kymber-secrets:ro
    networks:
      - proxy
    depends_on:
      - backend

volumes:
  mariadb_data:
  kymber_secrets:

networks:
  data:
  proxy:
    name: kymber
