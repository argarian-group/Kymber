services:
  secrets-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "if [ ! -s /run/kymber-secrets/service-encryption-key ]; then head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n' > /tmp/service-encryption-key; chown 65532:65532 /tmp/service-encryption-key; chmod 0400 /tmp/service-encryption-key; mv /tmp/service-encryption-key /run/kymber-secrets/service-encryption-key; fi; cp /host-secrets/local-ssh-key /run/kymber-secrets/local-ssh-key; cp /host-secrets/local-ssh-hostkey.pub /run/kymber-secrets/local-ssh-hostkey.pub; chown 65532:65532 /run/kymber-secrets/local-ssh-key /run/kymber-secrets/local-ssh-hostkey.pub /run/kymber-secrets; chmod 0400 /run/kymber-secrets/local-ssh-key; chmod 0444 /run/kymber-secrets/local-ssh-hostkey.pub; chmod 0700 /run/kymber-secrets"]
    volumes:
      - kymber_secrets:/run/kymber-secrets
      - ${KYMBER_LOCAL_SSH_PRIVATE_KEY_FILE:-./.local/kymber-local-ssh}:/host-secrets/local-ssh-key:ro
      - ${KYMBER_LOCAL_SSH_HOST_KEY_FILE:-/etc/ssh/ssh_host_ed25519_key.pub}:/host-secrets/local-ssh-hostkey.pub:ro

  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kymber
      - --providers.http.endpoint=${TRAEFIK_CONFIG_URL:-http://backend:8080/internal/traefik/panel-domain}
      - --providers.http.headers.Authorization=Bearer ${TRAEFIK_CONFIG_TOKEN:-}
      - --providers.http.pollinterval=2s
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addRoutersLabels=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${APP_PORT:-3000}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-kymber}
      MARIADB_USER: ${DB_USER:-kymber}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      TRAEFIK_CONFIG_TOKEN: ${TRAEFIK_CONFIG_TOKEN:-}
      SECURE_ONBOARD: ${SECURE_ONBOARD:-false}
      SERVICE_ENCRYPTION_KEY_FILE: /run/kymber-secrets/service-encryption-key
      KYMBER_TRUST_PROXY: "true"
      KYMBER_LOCAL_SSH_HOST: host.docker.internal
      KYMBER_LOCAL_SSH_PRIVATE_KEY_FILE: /run/kymber-secrets/local-ssh-key
      KYMBER_LOCAL_SSH_HOST_KEY_FILE: /run/kymber-secrets/local-ssh-hostkey.pub
      TRAEFIK_PANEL_API_TARGET: http://backend:8080
      TRAEFIK_PANEL_WEB_TARGET: http://frontend:80
      KYMBER_SERVER_TOKEN_FILE: /run/kymber-secrets/server-token
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-kymber}
      DB_USER: ${DB_USER:-kymber}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KYMBER_METRICS_TOKEN: ${KYMBER_METRICS_TOKEN:-}
      KYMBER_PROMETHEUS_URL: http://prometheus:9090
    networks:
      - data
      - proxy
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.kymber-api.rule=Path(`/api`) || PathPrefix(`/api/`) || Path(`/health`)
      - traefik.http.routers.kymber-api.entrypoints=web
      - traefik.http.routers.kymber-api.priority=100
      - traefik.http.services.kymber-api.loadbalancer.server.port=8080
      - traefik.docker.network=kymber
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    volumes:
      - kymber_secrets:/run/kymber-secrets

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.kymber-frontend.rule=PathPrefix(`/`) && !Path(`/api`) && !PathPrefix(`/api/`) && !Path(`/health`)
      - traefik.http.routers.kymber-frontend.entrypoints=web
      - traefik.http.routers.kymber-frontend.priority=1
      - traefik.http.routers.kymber-frontend.middlewares=kymber-spa
      - traefik.http.services.kymber-frontend.loadbalancer.server.port=80
      - traefik.docker.network=kymber
      - traefik.http.middlewares.kymber-spa.errors.status=404
      - traefik.http.middlewares.kymber-spa.errors.statusRewrites.404=200
      - traefik.http.middlewares.kymber-spa.errors.service=kymber-frontend
      - traefik.http.middlewares.kymber-spa.errors.query=/index.html
    depends_on:
      - backend
      - traefik
    networks:
      - proxy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s#__KYMBER_API__#$${KYMBER_API_HOST}#g" /etc/kymber/prometheus.yml.tmpl > /prometheus/prometheus.yml
        printf '%s' "$${KYMBER_METRICS_TOKEN}" > /prometheus/metrics-token
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      KYMBER_API_HOST: ${KYMBER_API_HOST:-backend:8080}
      KYMBER_METRICS_TOKEN: ${KYMBER_METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus:/etc/kymber:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy

  server:
    profiles: [monitoring]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: server
    restart: unless-stopped
    environment:
      KYMBER_API_URL: http://backend:8080
      KYMBER_SERVER_TOKEN_FILE: /run/kymber-secrets/server-token
    volumes:
      - kymber_secrets:/run/kymber-secrets:ro
    networks:
      - proxy
    depends_on:
      - backend

volumes:
  mariadb_data:
  kymber_secrets:
  traefik_certs:
  prometheus_data:

networks:
  data:
  proxy:
    name: kymber
